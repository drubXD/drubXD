<!doctype html><html lang="en"><meta charset="utf-8"><title>MRI slice viewer</title>
<style>body{background:#101822;color:#eef3f8;font:18px system-ui;max-width:46rem;margin:3rem auto;padding:1rem}img{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}input{width:100%}</style>
<h1>MRI slice viewer</h1><img id="scan" alt="Selected grayscale slice">
<label for="slice">Slice <output id="position"></output></label><input type="range" id="slice" min="1" value="1">
<p>Research viewer · Percentile windowing · Pixel aspect ratio in display space</p>
<script>
const frames = /*FRAMES*/[];
const slider = document.querySelector('#slice');
slider.max = frames.length;
function render() {
  document.querySelector('#scan').src = 'data:image/png;base64,' + frames[slider.value - 1];
  document.querySelector('#position').textContent = slider.value + ' / ' + frames.length;
}
slider.addEventListener('input', render);
render();
</script></html>
